name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacidade:
    name: Privacidade e segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a varredura olha o histórico inteiro
      - name: Manifesto
        run: ./scripts/ci/gate_manifesto.sh
      - name: Nenhum arquivo sensível
        run: ./scripts/ci/gate_arquivos_sensiveis.sh
      - name: Nenhum dado pessoal ou de instalação
        run: bash scripts/verificar-privacidade.sh

  compilar:
    name: Compilar e testar
    needs: privacidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK do Android 17
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
      - name: Compilar e testar
        run: ./scripts/compilar.sh
